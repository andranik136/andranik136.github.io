[project]
name = "matrix-system-monitor"
version = "0.2.0"
description = "Retro black & vibrant phosphor system telemetry, log stream, clock, and calendar for Linux/Bazzite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
]

[project.scripts]
matrix-monitor = "main:main"
