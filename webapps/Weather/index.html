<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0F172A"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Weather">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- ChartJS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    
    <style>
        :root {
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.45);
            --glass-bg: rgba(15, 23, 42, 0.35);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-card: rgba(255, 255, 255, 0.05);
            --glass-card-hover: rgba(255, 255, 255, 0.09);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 1s ease-in-out;
            position: relative;
            overflow-x: hidden;
        }

        /* Time of Day Sky Gradients */
        body.bg-time-morning {
            background-image: linear-gradient(to bottom, #74b9ff, #a29bfe, #ffeaa7) !important;
        }
        body.bg-time-midday-sunny {
            background-image: linear-gradient(to bottom, #0984e3, #74b9ff, #e3fafc) !important;
        }
        body.bg-time-midday-gloomy {
            background-image: linear-gradient(to bottom, #2c3e50, #7f8c8d, #dcdde1) !important;
        }
        body.bg-time-evening {
            background-image: linear-gradient(to bottom, #3a1c71, #d76d77, #ffaf7b) !important;
        }
        body.bg-time-night {
            background-image: linear-gradient(to bottom, #020617, #0f172a, #1e1b4b) !important;
        }

        /* Glass Background Overlay */
        .glass-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.1) 0%, rgba(15, 23, 42, 0.35) 100%);
            z-index: 2;
            pointer-events: none;
        }



        main {
            max-width: 32rem;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(170%);
            -webkit-backdrop-filter: blur(24px) saturate(170%);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            z-index: 3;
            margin: auto;
            transition: max-width 0.4s ease;
        }

        /* --- Layout Columns --- */
        .weather-layout-grid {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
        }

        .layout-col-left, .layout-col-right {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
            min-width: 0; /* CRITICAL: prevents column blowout on Chart.js and scrolls */
        }

        /* --- Header & Search --- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .location-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            font-size: 1.1rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.45rem 0.9rem;
            border-radius: 14px;
            transition: background 0.3s, transform 0.2s;
            user-select: none;
            max-width: 70%;
        }

        .location-display:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .location-display:active {
            transform: translateY(0);
        }

        .location-display span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .location-display .search-arrow {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-left: 0.1rem;
            transition: transform 0.3s;
        }

        .location-display:hover .search-arrow {
            transform: translateY(1px);
        }

        /* Inline Sliding Search Overlay */
        .search-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(16px);
            border-radius: 1.75rem;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(-10px);
            display: flex;
            align-items: center;
            padding: 0 1.25rem;
        }

        .search-overlay.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .search-container {
            width: 100%;
        }

        #search-form {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 0.5rem 1rem;
            position: relative;
        }

        #search-form .search-icon {
            color: rgba(255, 255, 255, 0.5);
            margin-right: 0.75rem;
            font-size: 1.1rem;
        }

        #search-form input {
            background: none;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-family: inherit;
            width: 100%;
            outline: none;
        }

        #search-form input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .close-search-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.25rem;
            transition: color 0.2s, transform 0.2s;
            margin-left: 0.5rem;
        }

        .close-search-btn:hover {
            color: white;
            transform: scale(1.1);
        }

        /* --- Sliding Unit Switch --- */
        .unit-toggle-container {
            display: flex;
            align-items: center;
        }

        .unit-toggle {
            position: relative;
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 2px;
            cursor: pointer;
            user-select: none;
            width: 80px;
            height: 34px;
            align-items: center;
            justify-content: space-between;
            transition: background 0.3s ease;
        }

        .unit-toggle:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .unit-btn {
            flex: 1;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.65);
            z-index: 2;
            transition: color 0.3s ease;
        }

        .unit-btn.active {
            color: #0f172a;
        }

        .toggle-track {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 36px;
            height: 28px;
            background: white;
            border-radius: 18px;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .unit-toggle.c-active .toggle-track {
            transform: translateX(38px);
        }

        /* --- Current Weather --- */
        #current-weather {
            text-align: center;
            padding: 0.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .current-main-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin: 0.5rem 0;
        }

        #current-temp {
            font-size: 6rem;
            font-weight: 200;
            letter-spacing: -0.04em;
            margin: 0;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        #current-weather-icon {
            font-size: 4.5rem;
            color: white;
            filter: drop-shadow(0 4px 15px var(--accent-glow));
            animation: float-main-icon 4s ease-in-out infinite alternate;
        }

        @keyframes float-main-icon {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(4deg); }
        }

        #current-condition {
            font-size: 1.4rem;
            font-weight: 300;
            color: white;
            margin: 0 0 0.5rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .temp-range {
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 1.15rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.06);
            padding: 0.35rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- Reusable Card Styles --- */
        .weather-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 1.25rem;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 100%;
            overflow: hidden; /* Prevent visual overflow */
        }

        .weather-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 600;
            letter-spacing: 0.08em;
            margin: 0 0 1rem 0;
            padding: 0 0 0.6rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-header i {
            font-size: 0.95rem;
            color: var(--accent);
        }

        /* --- Horizontal Forecast --- */
        .horizontal-forecast {
            display: flex;
            overflow-x: auto;
            gap: 0.75rem;
            padding-bottom: 0.5rem;
            scrollbar-width: thin;
            width: 100%;
            max-width: 100%;
        }

        .horizontal-forecast-item {
            flex: 0 0 68px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 0.85rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s, background 0.2s, border-color 0.2s;
        }

        .horizontal-forecast-item:hover {
            transform: scale(1.06);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .horizontal-forecast-item .time, .horizontal-forecast-item .day-name {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 0.4rem;
        }

        .horizontal-forecast-item i {
            font-size: 1.5rem;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            margin-bottom: 0.4rem;
            filter: drop-shadow(0 2px 8px var(--accent-glow));
        }

        .horizontal-forecast-item .temp {
            font-size: 1rem;
            font-weight: 600;
            color: white;
        }

        /* Custom scrollbars */
        .horizontal-forecast::-webkit-scrollbar {
            height: 5px;
        }
        .horizontal-forecast::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        .horizontal-forecast::-webkit-scrollbar-track {
            background: transparent;
        }

        /* --- Details Grid --- */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            width: 100%;
        }

        .detail-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 1.1rem 1.25rem;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            max-width: 100%;
            overflow: hidden;
        }

        .detail-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.22);
        }

        .detail-card.span-2 {
            grid-column: span 2;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
        }

        .detail-icon {
            font-size: 0.95rem;
            color: var(--accent);
        }

        .detail-value {
            font-size: 1.6rem;
            font-weight: 500;
            color: white;
            margin-bottom: 0.2rem;
            letter-spacing: -0.02em;
        }

        .detail-sub {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.55);
        }

        .detail-desc {
            font-size: 0.95rem;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
        }

        /* --- Chart Section --- */
        #daily-chart-container {
            height: 180px;
            margin-bottom: 1.5rem;
            position: relative;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }

        #daily-chart-container canvas {
            max-width: 100% !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* --- Loading Screen Styles --- */
        #loading {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(170%);
            -webkit-backdrop-filter: blur(24px) saturate(170%);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            max-width: 32rem;
            width: 90%;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
            text-align: center;
            z-index: 3;
        }

        #loading-message {
            font-size: 1.35rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        #loading-submessage {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0px;
        }

        /* Custom Loading Spinner */
        .loading-spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.75rem;
        }

        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin-loading 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .spinner-cloud {
            position: absolute;
            font-size: 2.1rem;
            color: white;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-cloud 2s ease-in-out infinite alternate;
        }

        @keyframes spin-loading {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse-cloud {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.65; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Initial Location Form fallback */
        #location-form {
            margin-top: 1.5rem;
        }

        #location-form input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            font-family: inherit;
            width: 100%;
            text-align: center;
            transition: border-color 0.3s;
        }

        #location-form input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        #location-form input:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }

        #location-form button {
            margin-top: 0.75rem;
            background: white;
            color: #0f172a;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: transform 0.2s, background 0.2s;
            width: 100%;
        }

        #location-form button:hover {
            background: #f1f5f9;
            transform: scale(1.02);
        }

        #location-form button:active {
            transform: scale(0.98);
        }

        /* --- Footer --- */
        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            z-index: 3;
            max-width: 32rem;
            width: 90%;
            line-height: 1.4;
            transition: max-width 0.4s ease;
        }

        footer a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            transition: color 0.2s, border-color 0.2s;
        }

        footer a:hover {
            color: white;
            border-color: white;
        }

        .hidden {
            display: none !important;
        }



        /* --- Micro animations for detail icons --- */
        @keyframes spin-wind {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .wind-animate {
            animation: spin-wind 4s linear infinite;
            display: inline-block;
        }

        @keyframes pulse-humidity {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; color: #38bdf8; }
        }
        .humidity-animate {
            animation: pulse-humidity 2.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes bounce-rain {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); color: #60a5fa; }
        }
        .rain-animate {
            animation: bounce-rain 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes scale-temp {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); color: #f97316; }
        }
        .temp-animate {
            animation: scale-temp 3s ease-in-out infinite;
            display: inline-block;
        }

        /* --- Entry Fade In Animations --- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; /* starts transparent */
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        /* --- Desktop Layout Enhancements (2-column responsive layout) --- */
        @media (min-width: 768px) {
            body {
                padding: 2.5rem 1.5rem;
            }

            main {
                max-width: 64rem;
                padding: 2rem;
            }

            .app-header {
                margin-bottom: 1.5rem;
            }

            .weather-layout-grid {
                display: grid;
                grid-template-columns: 1fr 1.25fr;
                gap: 1.5rem;
                align-items: start;
            }
            
            footer {
                max-width: 64rem;
            }
        }
    </style>
</head>
<body>

    <div class="glass-overlay"></div>

    <!-- Loading Screen -->
    <div id="loading" class="animate-fade-in">
        <div class="loading-spinner-container">
            <div class="spinner-ring"></div>
            <i class="fa-solid fa-cloud spinner-cloud"></i>
        </div>
        <p id="loading-message">Locating your position...</p>
        <p id="loading-submessage">Please allow location access if prompted.</p>
        
        <form id="location-form" class="hidden">
            <input type="text" id="city-input" placeholder="Enter City, State, or ZIP" required>
            <button type="submit">Get Weather</button>
        </form>
    </div>

    <!-- Main Weather Container -->
    <main id="weather-container" class="hidden">
        <!-- Header -->
        <header class="app-header">
            <div class="location-display" id="location-trigger">
                <i class="fa-solid fa-location-dot"></i>
                <span id="location">--</span>
                <i class="fa-solid fa-chevron-down search-arrow"></i>
            </div>
            
            <div class="unit-toggle-container">
                <div class="unit-toggle" id="unit-toggle-switch">
                    <div class="toggle-track"></div>
                    <span class="unit-btn active" id="unit-f">°F</span>
                    <span class="unit-btn" id="unit-c">°C</span>
                </div>
            </div>

            <!-- Inline Sliding Search Overlay -->
            <div class="search-overlay" id="search-overlay">
                <div class="search-container">
                    <form id="search-form">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="search-city-input" placeholder="Enter City, State, or ZIP..." autocomplete="off">
                        <button type="button" class="close-search-btn" id="close-search">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </form>
                </div>
            </div>
        </header>

        <!-- Two-column responsive weather grid -->
        <div class="weather-layout-grid">
            <!-- Left Column -->
            <div class="layout-col-left">
                <!-- Current Weather Section -->
                <section id="current-weather" class="animate-fade-in delay-1">
                    <div class="current-main-info">
                        <p id="current-temp">--&deg;</p>
                        <i id="current-weather-icon" class="wi wi-day-sunny"></i>
                    </div>
                    <p id="current-condition">--</p>
                    <div class="temp-range">
                        <span id="high-temp">H:--&deg;</span>
                        <span id="low-temp">L:--&deg;</span>
                    </div>
                </section>

                <!-- Weather Details Grid -->
                <section class="details-grid animate-fade-in delay-2">
                    <!-- Wind -->
                    <div class="detail-card">
                        <div class="detail-header">
                            <i class="fa-solid fa-wind detail-icon wind-animate"></i>
                            <span>WIND</span>
                        </div>
                        <div class="detail-value" id="detail-wind-val">--</div>
                        <div class="detail-sub" id="detail-wind-sub">--</div>
                    </div>
                    
                    <!-- Humidity -->
                    <div class="detail-card">
                        <div class="detail-header">
                            <i class="fa-solid fa-droplet detail-icon humidity-animate"></i>
                            <span>HUMIDITY</span>
                        </div>
                        <div class="detail-value" id="detail-humidity-val">--</div>
                        <div class="detail-sub" id="detail-humidity-sub">--</div>
                    </div>
                    
                    <!-- Rain Chance -->
                    <div class="detail-card">
                        <div class="detail-header">
                            <i class="fa-solid fa-cloud-showers-water detail-icon rain-animate"></i>
                            <span>RAIN CHANCE</span>
                        </div>
                        <div class="detail-value" id="detail-rain-val">--</div>
                        <div class="detail-sub" id="detail-rain-sub">--</div>
                    </div>

                    <!-- Dew Point / Feels like -->
                    <div class="detail-card">
                        <div class="detail-header">
                            <i class="fa-solid fa-temperature-half detail-icon temp-animate"></i>
                            <span>DEW POINT</span>
                        </div>
                        <div class="detail-value" id="detail-temp-val">--</div>
                        <div class="detail-sub" id="detail-temp-sub">--</div>
                    </div>

                    <!-- Long Summary (Spans 2 columns) -->
                    <div class="detail-card span-2">
                        <div class="detail-header">
                            <i class="fa-solid fa-quote-left detail-icon"></i>
                            <span>FORECAST SUMMARY</span>
                        </div>
                        <div class="detail-desc" id="detail-desc-text">--</div>
                    </div>
                </section>
            </div>

            <!-- Right Column -->
            <div class="layout-col-right">
                <!-- Hourly Forecast Section -->
                <section id="hourly-card" class="weather-card animate-fade-in delay-3">
                    <h2 class="card-header"><i class="fa-regular fa-clock"></i> HOURLY FORECAST</h2>
                    <div id="hourly-forecast-container" class="horizontal-forecast">
                        <!-- Hourly items injected by JS -->
                    </div>
                </section>

                <!-- 7-Day Forecast Section -->
                <section id="daily-card" class="weather-card animate-fade-in delay-4">
                    <h2 class="card-header"><i class="fa-regular fa-calendar-days"></i> 7-DAY FORECAST</h2>
                    <div id="daily-chart-container">
                        <canvas id="daily-chart"></canvas>
                    </div>
                    <div id="daily-forecast-container" class="horizontal-forecast">
                        <!-- Daily items injected by JS -->
                    </div>
                </section>
            </div>
        </div>
    </main>
    
    <!-- Footer Credit -->
    <footer id="weather-credit" class="hidden animate-fade-in delay-4">
        <p>Weather data provided by the <a href="https://www.weather.gov" target="_blank" rel="noopener noreferrer">National Weather Service</a>.</p>
    </footer>

    <script>
        $(document).ready(function() {
            let dailyChartInstance;
            Chart.register(ChartDataLabels);

            // Global State
            let currentUnit = 'F';
            let hourlyDataCache, dailyDataCache;
            let openMeteoTodayHigh, openMeteoTodayLow;

            const iconMapping = {
                "skc": "CLEAR_DAY", "few": "PARTLY_CLOUDY_DAY", "sct": "PARTLY_CLOUDY_DAY",
                "bkn": "CLOUDY", "ovc": "CLOUDY", "wind_skc": "WIND", "wind_few": "WIND",
                "wind_sct": "WIND", "wind_bkn": "WIND", "wind_ovc": "WIND", "snow": "SNOW",
                "rain_snow": "SLEET", "rain_sleet": "SLEET", "snow_sleet": "SLEET", "fzra": "SLEET",
                "rain_fzra": "SLEET", "snow_fzra": "SLEET", "sleet": "SLEET", "rain": "RAIN",
                "rain_showers": "RAIN", "rain_showers_hi": "RAIN", "tsra": "RAIN", "tsra_sct": "RAIN",
                "tsra_hi": "RAIN", "tornado": "WIND", "hurricane": "WIND", "tropical_storm": "WIND",
                "dust": "FOG", "smoke": "FOG", "haze": "FOG", "fog": "FOG", "hot": "CLEAR_DAY",
                "cold": "CLEAR_DAY", "blizzard": "SNOW"
            };

            const weatherIconMapping = {
                'CLEAR_DAY': 'wi-day-sunny', 'PARTLY_CLOUDY_DAY': 'wi-day-cloudy',
                'CLOUDY': 'wi-cloudy', 'RAIN': 'wi-rain', 'SNOW': 'wi-snow',
                'SLEET': 'wi-sleet', 'WIND': 'wi-strong-wind', 'FOG': 'wi-fog'
            };
            
            // --- Utility Functions ---
            function convertTemp(tempF) {
                if (currentUnit === 'C') {
                    return Math.round((tempF - 32) * 5 / 9);
                }
                return tempF;
            }

            function setBackgroundImage(skyconKey) {
                const hour = new Date().getHours();
                let timeOfDayClass = '';

                if (hour >= 5 && hour < 10) {
                    timeOfDayClass = 'bg-time-morning';
                } else if (hour >= 10 && hour < 17) {
                    const gloomyConditions = ['CLOUDY', 'RAIN', 'SNOW', 'SLEET', 'FOG'];
                    if (gloomyConditions.includes(skyconKey)) {
                        timeOfDayClass = 'bg-time-midday-gloomy';
                    } else {
                        timeOfDayClass = 'bg-time-midday-sunny';
                    }
                } else if (hour >= 17 && hour < 20) {
                    timeOfDayClass = 'bg-time-evening';
                } else {
                    timeOfDayClass = 'bg-time-night';
                }

                // Remove existing bg-time-* classes
                $('body').removeClass((index, className) => {
                    return (className.match(/(^|\s)bg-time-\S+/g) || []).join(' ');
                });

                // Add the new time of day background class
                $('body').addClass(timeOfDayClass);
            }



            // --- Event Handlers ---
            // Unit Toggle Switch Handler
            $('#unit-toggle-switch').on('click', function() {
                currentUnit = (currentUnit === 'F') ? 'C' : 'F';
                if (currentUnit === 'F') {
                    $(this).removeClass('c-active');
                    $('#unit-f').addClass('active');
                    $('#unit-c').removeClass('active');
                } else {
                    $(this).addClass('c-active');
                    $('#unit-c').addClass('active');
                    $('#unit-f').removeClass('active');
                }
                updateAllDisplays();
            });

            // Expandable Inline Search Bar Trigger
            $('#location-trigger').on('click', () => {
                $('#search-overlay').addClass('active');
                setTimeout(() => $('#search-city-input').focus(), 150);
            });

            $('#close-search').on('click', () => {
                $('#search-overlay').removeClass('active');
            });

            // Handle Forms Submission
            $('#search-form').on('submit', function(e) {
                e.preventDefault();
                const city = $('#search-city-input').val().trim();
                if (city) {
                    getWeatherByCity(city);
                    $('#search-overlay').removeClass('active');
                    $('#search-city-input').val('');
                }
            });

            $('#location-form').on('submit', function(e) {
                e.preventDefault();
                getWeatherByCity($('#city-input').val().trim());
            });

            // --- Geolocation and API Fetching ---
            function getLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(showPosition, showError);
                } else {
                    showError(); 
                }
            }

            function showPosition(position) {
                getWeather(position.coords.latitude.toFixed(4), position.coords.longitude.toFixed(4));
            }

            function showError(error) {
                let message = "Could not get your location. Please enter it manually.";
                if (error) { 
                    switch(error.code) {
                        case error.PERMISSION_DENIED: message = "Location access denied. Please enter it manually."; break;
                        case error.POSITION_UNAVAILABLE: message = "Location information is unavailable. Please enter it manually."; break;
                    }
                }
                $('#loading-message').text(message);
                $('#loading-submessage').addClass('hidden');
                $('#location-form').removeClass('hidden');
            }

            function getWeatherByCity(city) {
                if (!city) return;
                $('#loading-message').text(`Searching for ${city}...`);
                $('#location-form').addClass('hidden');
                $('#loading').removeClass('hidden');
                $('#weather-container').addClass('hidden');
                $('#weather-credit').addClass('hidden');

                const geocodeUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`;
                $.getJSON(geocodeUrl, data => {
                    if (data && data.results && data.results.length > 0) {
                        getWeather(data.results[0].latitude.toFixed(4), data.results[0].longitude.toFixed(4));
                    } else {
                        $('#loading-message').text(`Could not find "${city}". Please try again.`);
                        $('#location-form').removeClass('hidden');
                    }
                }).fail(() => {
                     $('#loading-message').text("Failed to look up location. Please check your connection.");
                     $('#location-form').removeClass('hidden');
                });
            }

            function getWeather(lat, lon) {
                const pointsUrl = `https://api.weather.gov/points/${lat},${lon}`;
                const openMeteoUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`;
                $('#loading-message').text('Fetching weather data...');

                $.getJSON(pointsUrl, data => {
                    const { forecast: forecastUrl, forecastHourly: hourlyForecastUrl } = data.properties;
                    const { city, state } = data.properties.relativeLocation.properties;
                    $('#location').text(`${city}, ${state}`);

                    $.when($.getJSON(hourlyForecastUrl), $.getJSON(forecastUrl), $.getJSON(openMeteoUrl))
                     .done((hourly, daily, openMeteo) => {
                        hourlyDataCache = hourly[0].properties.periods;
                        dailyDataCache = daily[0].properties.periods;
                        
                        // Parse today's true high & low temperatures from Open-Meteo calendar day data
                        if (openMeteo && openMeteo[0] && openMeteo[0].daily) {
                            openMeteoTodayHigh = Math.round(openMeteo[0].daily.temperature_2m_max[0]);
                            openMeteoTodayLow = Math.round(openMeteo[0].daily.temperature_2m_min[0]);
                        } else {
                            openMeteoTodayHigh = undefined;
                            openMeteoTodayLow = undefined;
                        }

                        // CRITICAL: Unhide elements FIRST so browser can layout and compute dimensions
                        $('#loading').addClass('hidden');
                        $('#weather-container').removeClass('hidden').addClass('animate-fade-in');
                        $('#weather-credit').removeClass('hidden').addClass('animate-fade-in');

                        // THEN render displays so Chart.js measures container size correctly
                        updateAllDisplays();
                    }).fail(() => {
                        $('#loading-message').text("Failed to fetch weather data. Please try again later.");
                        $('#location-form').removeClass('hidden');
                    });
                }).fail(() => {
                    $('#loading-message').text("Could not retrieve weather station data for your location.");
                    $('#location-form').removeClass('hidden');
                });
            }

            // --- Display Update Functions ---
            function updateAllDisplays() {
                if (hourlyDataCache && dailyDataCache) {
                    displayCurrentWeather(hourlyDataCache, dailyDataCache);
                    displayHourlyForecast(hourlyDataCache);
                    displayDailyForecast(dailyDataCache);
                    displayWeatherDetails(hourlyDataCache, dailyDataCache);
                }
            }

            function getSkyconIdentifier(iconUrl) {
                if (!iconUrl) return "CLOUDY";
                const parts = iconUrl.split('/');
                const iconName = parts[parts.length - 1].split('?')[0].split(',')[0];
                const key = iconName.replace(/_\d*$/, '').split(/(\d+)/)[0];
                return iconMapping[key] || "CLOUDY";
            }

            function displayCurrentWeather(hourlyPeriods, dailyPeriods) {
                const currentHour = hourlyPeriods[0];
                const todayForecast = dailyPeriods[0];
                const tomorrowForecast = dailyPeriods[1];

                $('#current-temp').html(`${convertTemp(currentHour.temperature)}&deg;`);
                $('#current-condition').text(currentHour.shortForecast);
                
                // Use Open-Meteo True High/Low if available, otherwise fall back to NWS periods
                let high = (openMeteoTodayHigh !== undefined) ? openMeteoTodayHigh : (todayForecast.isDaytime ? todayForecast.temperature : tomorrowForecast.temperature);
                let low = (openMeteoTodayLow !== undefined) ? openMeteoTodayLow : (!todayForecast.isDaytime ? todayForecast.temperature : tomorrowForecast.temperature);

                $('#high-temp').html(`H:${convertTemp(high)}&deg;`);
                $('#low-temp').html(`L:${convertTemp(low)}&deg;`);
                
                const skyconId = getSkyconIdentifier(currentHour.icon);
                const iconClass = weatherIconMapping[skyconId] || 'wi-cloud';
                
                $('#current-weather-icon').attr('class', `wi ${iconClass}`);
                setBackgroundImage(skyconId);
            }

            function displayWeatherDetails(hourlyPeriods, dailyPeriods) {
                const currentHour = hourlyPeriods[0];
                const todayForecast = dailyPeriods[0];
                
                // Wind details
                const windSpeed = currentHour.windSpeed || '--';
                const windDir = currentHour.windDirection || '';
                $('#detail-wind-val').text(windSpeed);
                $('#detail-wind-sub').text(`Direction: ${windDir || 'N/A'}`);
                
                // Humidity details
                const humidityObj = currentHour.relativeHumidity;
                const humidityVal = (humidityObj && humidityObj.value !== null) ? humidityObj.value : null;
                if (humidityVal !== null) {
                    $('#detail-humidity-val').text(`${humidityVal}%`);
                    let subText = "Comfortable";
                    if (humidityVal > 65) subText = "Humid";
                    else if (humidityVal < 30) subText = "Dry";
                    $('#detail-humidity-sub').text(subText);
                } else {
                    $('#detail-humidity-val').text('--');
                    $('#detail-humidity-sub').text('Unavailable');
                }
                
                // Rain Chance details
                const rainObj = currentHour.probabilityOfPrecipitation;
                const rainVal = (rainObj && rainObj.value !== null) ? rainObj.value : 0;
                $('#detail-rain-val').text(`${rainVal}%`);
                let rainSub = "No precipitation";
                if (rainVal > 50) rainSub = "High chance of rain";
                else if (rainVal > 20) rainSub = "Slight chance";
                $('#detail-rain-sub').text(rainSub);
                
                // Dew Point details
                const dewpointObj = currentHour.dewpoint;
                if (dewpointObj && dewpointObj.value !== null) {
                    let dewF = Math.round(dewpointObj.value * 9/5 + 32);
                    let displayDew = currentUnit === 'F' ? dewF : Math.round(dewpointObj.value);
                    $('#detail-temp-val').text(`${displayDew}°`);
                    $('#detail-temp-sub').text(`Dew point temperature`);
                } else {
                    $('#detail-temp-val').text(`${convertTemp(currentHour.temperature)}°${currentUnit}`);
                    $('#detail-temp-sub').text(`Current temperature`);
                }
                
                // Short/Long Forecast summary text
                $('#detail-desc-text').text(todayForecast.detailedForecast || currentHour.shortForecast || 'No summary available.');
            }

            function displayHourlyForecast(periods) {
                const container = $('#hourly-forecast-container');
                container.empty();
                const now = new Date();

                periods.slice(0, 24).forEach(period => {
                    const time = new Date(period.startTime);
                    let hour = time.getHours();
                    const ampm = hour >= 12 ? 'PM' : 'AM';
                    hour = hour % 12 || 12;
                    const displayTime = (time.getHours() === now.getHours()) ? 'Now' : `${hour}${ampm}`;
                    const iconClass = weatherIconMapping[getSkyconIdentifier(period.icon)] || 'wi-cloud';

                    const item = `
                        <div class="horizontal-forecast-item">
                            <span class="time">${displayTime}</span>
                            <i class="wi ${iconClass}"></i>
                            <span class="temp">${convertTemp(period.temperature)}&deg;</span>
                        </div>
                    `;
                    container.append(item);
                });
            }

            function displayDailyForecast(periods) {
                const container = $('#daily-forecast-container');
                container.empty();
                
                const processedDays = new Map();
                periods.forEach(period => {
                    const dayName = new Date(period.startTime).toLocaleDateString('en-US', { weekday: 'short' });
                    if (!processedDays.has(dayName)) {
                        processedDays.set(dayName, { high: -273, low: 999, icon: period.icon });
                    }
                    let dayData = processedDays.get(dayName);
                    if (period.isDaytime) {
                        dayData.high = Math.max(dayData.high, period.temperature);
                    } else {
                        dayData.low = Math.min(dayData.low, period.temperature);
                    }
                });

                const firstDayName = new Date(periods[0].startTime).toLocaleDateString('en-US', { weekday: 'short' });
                
                // Inject true high/low for today if provided by Open-Meteo
                if (processedDays.has(firstDayName)) {
                    const firstDayData = processedDays.get(firstDayName);
                    if (openMeteoTodayHigh !== undefined) {
                        firstDayData.high = openMeteoTodayHigh;
                    }
                    if (openMeteoTodayLow !== undefined) {
                        firstDayData.low = openMeteoTodayLow;
                    }
                }

                // Night fallback logic for NWS if Open-Meteo fails
                if (!periods[0].isDaytime && openMeteoTodayHigh === undefined) {
                    let todayHigh = -273;
                    hourlyDataCache.slice(0,12).forEach(p => {
                        if (new Date(p.startTime).getDate() === new Date().getDate()) {
                           todayHigh = Math.max(todayHigh, p.temperature);
                        }
                    });
                    if (todayHigh > -273) {
                        processedDays.get(firstDayName).high = todayHigh;
                    }
                }
                
                const chartLabels = [], highTemps = [], lowTemps = [];
                let dayCount = 0;

                processedDays.forEach((data, day) => {
                    if (dayCount >= 7) return;
                    const iconClass = weatherIconMapping[getSkyconIdentifier(data.icon)] || 'wi-cloud';
                    const isToday = day === new Date().toLocaleDateString('en-US', { weekday: 'short' });
                    const item = `
                        <div class="horizontal-forecast-item">
                            <span class="day-name">${isToday ? 'Now' : day}</span>
                            <i class="wi ${iconClass}"></i>
                            <span class="temp">${convertTemp(data.high)}&deg;</span>
                            <span class="temp" style="color: rgba(255, 255, 255, 0.45); font-weight: 400; font-size: 0.85rem;">${convertTemp(data.low)}&deg;</span>
                        </div>
                    `;
                    container.append(item);
                    chartLabels.push(day);
                    highTemps.push(convertTemp(data.high));
                    lowTemps.push(convertTemp(data.low));
                    dayCount++;
                });

                const ctx = document.getElementById('daily-chart').getContext('2d');
                if(dailyChartInstance) dailyChartInstance.destroy();

                const highGradient = ctx.createLinearGradient(0, 0, 0, 160);
                highGradient.addColorStop(0, '#f97316'); // Solid orange
                highGradient.addColorStop(1, '#facc15'); // Solid yellow

                const lowGradient = ctx.createLinearGradient(0, 0, 0, 160);
                lowGradient.addColorStop(0, '#3b82f6'); // Solid blue
                lowGradient.addColorStop(1, '#60a5fa'); // Solid light blue

                dailyChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: 'High', data: highTemps, borderColor: highGradient,
                            borderWidth: 3.5, fill: false, tension: 0.4,
                            pointRadius: 4, pointHoverRadius: 6,
                            pointBackgroundColor: '#ffffff', pointBorderColor: '#f97316',
                            datalabels: { align: 'top', offset: 6 }
                        }, {
                            label: 'Low', data: lowTemps, borderColor: lowGradient,
                            borderWidth: 3.5, fill: false, tension: 0.4,
                            pointRadius: 4, pointHoverRadius: 6,
                            pointBackgroundColor: '#ffffff', pointBorderColor: '#3b82f6',
                            datalabels: { align: 'bottom', offset: 6 }
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }, tooltip: { enabled: false },
                            datalabels: {
                                color: 'white',
                                font: { family: 'Outfit', weight: '600', size: 11 },
                                formatter: (value) => value !== undefined && value !== null ? `${value}°` : '',
                                backgroundColor: 'rgba(15, 23, 42, 0.5)',
                                borderRadius: 4,
                                padding: { top: 2, bottom: 2, left: 5, right: 5 }
                            }
                        },
                        scales: {
                            x: { 
                                grid: { display: false }, 
                                ticks: { 
                                    color: 'rgba(255, 255, 255, 0.75)', 
                                    font: { family: 'Outfit', size: 11 },
                                    padding: 8 
                                } 
                            },
                            y: { display: false }
                        },
                        layout: { padding: { top: 22, bottom: 18, left: 10, right: 10 } }
                    }
                });
            }

            function startWeatherApp() {
                const urlParams = new URLSearchParams(window.location.search);
                const location = urlParams.get('zip') || urlParams.get('city');
                if (location) {
                    $('#loading-submessage').addClass('hidden');
                    getWeatherByCity(location);
                } else {
                    getLocation();
                }
            }

            startWeatherApp();
        });
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered.', reg))
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
</body>
